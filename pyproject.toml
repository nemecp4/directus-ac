[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "directus-ac"
version = "0.1.0"
description = "CLI utility to manage Directus access control permissions declaratively"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
directus-ac = "directus_ac.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["directus_ac*"]

[tool.pytest.ini_options]
pythonpath = ["."]
